name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    name: Build and test
    # The code references macOS 26 APIs behind availability checks, so it
    # needs the macOS 26 SDK to compile.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
